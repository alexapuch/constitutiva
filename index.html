    <link rel="icon" type="image/png" sizes="196x196" href="/seprisa-logo.png" />
    <link rel="shortcut icon" href="/seprisa-logo.png" />
    <link rel="apple-touch-icon" href="/apple-icon-180.png" />
    <meta name="description" content="Sistema de actas constitutivas, cédula de simulacro y constancias - SEPRISA" />
    <!-- Preload OSRS section critical assets -->
    <link rel="preload" as="image" href="/osrs-bg.png" />

    <link rel="preload" as="image" href="/birdhouse-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:wght@600;700&family=MedievalSharp&family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>SEPRISA - Sistema de Constancias</title>
    <!-- v2 -->
  </head>
  <body style="background-color: #0B152A;">
    <div id="splash" style="position:fixed;inset:0;background:#0B152A;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.35s ease;pointer-events:auto">
      <img src="/seprisa-logo.png" alt="SEPRISA" style="width:min(70vw,320px);height:auto;object-fit:contain" />
    </div>
    <script>
      (function() {
        var dismissed = false;
        window.__hideSplash = function() {
          if (dismissed) return;
          dismissed = true;
          var s = document.getElementById('splash');
          if (s) {
            s.style.opacity = '0';
            s.style.pointerEvents = 'none';
            setTimeout(function() {
              if (s && s.parentNode) s.parentNode.removeChild(s);
            }, 350);
          }
        };
        // Red de seguridad: desvanecer en max 1.5s para evitar pantalla azul congelada
        setTimeout(window.__hideSplash, 1500);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
